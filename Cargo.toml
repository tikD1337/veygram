[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
# FFI crates (telegram, security, platform) lift the restriction locally and justify each unsafe block.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Release optimization with debug information — for WPA/ETW and profilers.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
