[package]
name = "tg-ui"
description = "Slint user interface and view models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tg-core = { path = "../core" }
slint = { version = "=1.19.0", features = ["unstable-winit-030", "raw-window-handle-06"] }
# The main window handle for the video player's native child window.
raw-window-handle = "0.6"
parley = "=0.12.0"
swash = "=0.2.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp", "bmp", "jpeg"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
qrcode = { version = "=0.15.0", default-features = false }
# Already in the dependency graph through Slint with the same features; local time only.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "=1.19.0"

[dev-dependencies]
tg-platform = { path = "../platform" }
# Validates the --check report format in tests.
serde_json = "1"
